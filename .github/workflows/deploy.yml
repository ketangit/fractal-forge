name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize deploys: never run two swaps against the VM at once, and let an
# in-flight deploy finish rather than abort mid-swap.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGION: us-east1
  # Artifact Registry path must be LOCATION-docker.pkg.dev/PROJECT/REPOSITORY/IMAGE.
  # `fractal-forge` is the repository; `app` is the image within it. Omitting the
  # image segment points manifests at the repo root and pushes fail with 400.
  IMAGE: us-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fractal-forge/app

jobs:
  test:
    name: Test (backend + frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 25
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Backend tests
        working-directory: backend
        run: mvn -B test

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test

  build-and-deploy:
    name: Build → Push → Deploy
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write  # required for Workload Identity Federation

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Authenticate to GCP (Workload Identity)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & push Docker image
        run: |
          IMAGE_TAG="${{ env.IMAGE }}:${{ github.sha }}"
          IMAGE_LATEST="${{ env.IMAGE }}:latest"

          # BuildKit pulls a fresh base (--pull) and uses the registry-side
          # `latest` image as a layer cache via inline cache metadata.
          #
          # --provenance=false --sbom=false: buildx would otherwise attach
          # SLSA provenance / SBOM attestations, turning the push into a
          # multi-manifest OCI image index. Artifact Registry rejects that
          # index on the manifest HEAD with `400 Bad Request`, so emit a
          # single plain image manifest instead.
          docker buildx build \
            --pull \
            --provenance=false \
            --sbom=false \
            --tag "${IMAGE_TAG}" \
            --tag "${IMAGE_LATEST}" \
            --cache-from "type=registry,ref=${IMAGE_LATEST}" \
            --cache-to "type=inline" \
            --push \
            .

      - name: Deploy to Cloud Run
        run: |
          # Roll the freshly pushed, immutable :$SHA image out to the
          # fractal-forge Cloud Run service. The container is the combined
          # jar (frontend static export served by Spring Boot on 8080).
          # --allow-unauthenticated makes it publicly reachable; no custom
          # domain is mapped here — the run.app URL is printed below.
          gcloud run deploy fractal-forge \
            --image "${{ env.IMAGE }}:${{ github.sha }}" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --port 8080 \
            --allow-unauthenticated \
            --quiet

      - name: Show service URL
        run: |
          gcloud run services describe fractal-forge \
            --region "${{ env.REGION }}" --platform managed \
            --format="value(status.url)"
