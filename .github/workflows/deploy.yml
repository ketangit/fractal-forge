name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize deploys: never run two swaps against the VM at once, and let an
# in-flight deploy finish rather than abort mid-swap.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGION: us-east1
  # Artifact Registry image path — fractal-forge repo was provisioned by tf-gcp-config
  IMAGE: us-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fractal-forge

jobs:
  test:
    name: Test (backend + frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 25
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Backend tests
        working-directory: backend
        run: mvn -B test

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test

  build-and-deploy:
    name: Build → Push → Deploy
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write  # required for Workload Identity Federation

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Authenticate to GCP (Workload Identity)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & push Docker image
        run: |
          IMAGE_TAG="${{ env.IMAGE }}:${{ github.sha }}"
          IMAGE_LATEST="${{ env.IMAGE }}:latest"

          # BuildKit pulls a fresh base (--pull) and uses the registry-side
          # `latest` image as a layer cache via inline cache metadata.
          docker buildx build \
            --pull \
            --tag "${IMAGE_TAG}" \
            --tag "${IMAGE_LATEST}" \
            --cache-from "type=registry,ref=${IMAGE_LATEST}" \
            --cache-to "type=inline" \
            --push \
            .
