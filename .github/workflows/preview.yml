name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

# One preview deploy per PR at a time; a new push supersedes the in-flight one.
concurrency:
  group: preview-pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build & Deploy Preview (Firebase Hosting)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Fork PRs get no id-token, so WIF auth would fail; only run for same-repo PRs.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation
      pull-requests: write # to comment the preview URL on the PR

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend test & build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Authenticate to GCP (Workload Identity)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting preview channel
        id: deploy
        run: |
          # firebase-tools picks up the ADC credentials file exported by the
          # auth step (GOOGLE_APPLICATION_CREDENTIALS) — no FIREBASE_TOKEN or
          # service-account key secret needed. Channels expire after 7 days.
          npx firebase-tools@15 hosting:channel:deploy "pr-${{ github.event.number }}" \
            --project craftedbyk-prod \
            --expires 7d \
            --json > deploy.json
          cat deploy.json
          URL=$(node -e "const r=require('./deploy.json');console.log(Object.values(r.result)[0].url)")
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          # Upsert a single bot comment (marker-keyed) instead of stacking one per push.
          MARKER="<!-- firebase-preview-url -->"
          BODY="${MARKER}
          🔥 **Firebase preview** deployed for commit ${{ github.event.pull_request.head.sha }}:

          ${URL}

          _Channel expires 7 days after the last deploy._"
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" \
            --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" | head -1)
          if [ -n "${EXISTING}" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/${EXISTING}" -f body="${BODY}"
          else
            gh api "repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" -f body="${BODY}"
          fi
